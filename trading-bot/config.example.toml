# Kopioi tämä tiedostoksi config.toml ja muokkaa.
# API-avaimia EI laiteta tähän tiedostoon, vaan ympäristömuuttujiin
# (BOT_API_KEY, BOT_API_SECRET) – katso README.md.

[market]
exchange = "binance"      # mikä tahansa ccxt:n tukema pörssi, esim. kraken, coinbase, bybit
symbol = "BTC/USDT"
timeframe = "1h"          # kynttilän pituus: 15m, 1h, 4h, 1d ...

[strategy]
fast_ema = 12
slow_ema = 26
rsi_period = 14
rsi_entry_max = 70        # ei osteta, jos RSI on tätä korkeampi (yliostettu)
rsi_exit = 80             # myydään, jos RSI nousee tämän yli
trend_ema = 200           # osta vain kun hinta on tämän EMA:n yläpuolella (0 = pois päältä)
atr_period = 14

[risk]
risk_per_trade = 0.01     # riskeerataan max 1 % pääomasta per kauppa (stop-lossiin asti)
max_position_pct = 0.25   # positio max 25 % pääomasta
stop_atr_mult = 2.0       # stop-loss = sisäänmeno - 2 * ATR
take_profit_rr = 3.0      # take-profit = 3 x riskin suuruus
max_drawdown_pct = 0.20   # pysäytä botti, jos pääoma laskee 20 % huipusta
fee_pct = 0.001           # kaupankäyntikulu (0.1 %)
slippage_pct = 0.0005     # oletettu lipsahdus (0.05 %)

[paper]
starting_balance = 1000.0 # paper trading -aloituspääoma (quote-valuuttana, esim. USDT)
state_file = "paper_state.json"

[runner]
poll_seconds = 60         # kuinka usein hinta ja stop-loss tarkistetaan
history_bars = 300        # montako kynttilää haetaan indikaattoreita varten
